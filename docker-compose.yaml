version: "5.1.2"
services:
  petstore_api_app:
    image: thmylonas1972/petstore_api_app-jib
    container_name: petstore_api_app
    ports:
      - 8080:8080
    networks:
      - petstore_postgres_network
    depends_on:
      - postgres
  postgres:
    image: postgres
    container_name: postgres2
    env_file: ./.env
    ports:
      - 5432:5432
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${ENV_POSTGRES_PASSWORD}
    volumes:
      - C:\Users\Thomas_Mylonas\Documents\_Projects_Data\postgres_data:/var/lib/postgresql
    networks:
      - petstore_postgres_network
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  petstore_postgres_network:
